services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: familjen
      POSTGRES_USER: familjen
      POSTGRES_PASSWORD: familjen-dev
    ports:
      - "5434:5432"
    volumes:
      - family_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familjen -d familjen"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    env_file:
      - .env.local
    environment:
      FAMILY_DATABASE_URL: postgresql://familjen:familjen-dev@database:5432/familjen
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      TZ: Europe/Stockholm
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  family_postgres_data:

